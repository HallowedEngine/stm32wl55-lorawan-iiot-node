services:
  # Mosquitto MQTT broker receives local LoRaWAN telemetry messages.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./devops/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - iiot_net
    restart: unless-stopped

  # InfluxDB stores IIoT time-series telemetry and alarm data.
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - iiot_net
    restart: unless-stopped

  # Grafana visualizes telemetry from InfluxDB using provisioned datasources.
  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/grafana/provisioning/:/etc/grafana/provisioning/:ro
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - iiot_net
    restart: unless-stopped

  # Backend subscriber consumes MQTT messages and writes validated telemetry.
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - iiot_net
    restart: unless-stopped

networks:
  iiot_net:
    driver: bridge

volumes:
  influxdb_data:
  grafana_data:
